<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DiffCAP results</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Public+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#f3f5f8;--panel:#fff;--ink:#14202b;--mute:#5b6773;--line:#d9dfe6;--und:#d1495b;--def:#1f5fa8;--soft:#e8eef6;
--serif:"Newsreader",Georgia,"Times New Roman",serif;--sans:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#10171e;--panel:#18212b;--ink:#e7edf3;--mute:#98a5b2;--line:#2a3643;--und:#ee6b7c;--def:#5fa0e8;--soft:#1f2c3a;color-scheme:dark}}
*{box-sizing:border-box}html{scroll-padding-top:16px}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans)}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
nav{position:sticky;top:0;align-self:start;height:100vh;padding:28px 18px;border-right:1px solid var(--line)}
nav h1{font:600 22px/1.15 var(--serif);margin:0 0 4px}nav p{margin:0 0 22px;color:var(--mute);font-size:13px}
nav a{display:block;padding:8px 10px;margin:2px 0;border-radius:6px;color:var(--ink);text-decoration:none;border-left:3px solid transparent}
nav a:hover{background:var(--soft)}nav a.on{background:var(--soft);border-left-color:var(--def);font-weight:600}
main{padding:34px clamp(16px,4vw,52px) 80px;max-width:1180px}
h2{font:600 30px/1.2 var(--serif);margin:0 0 6px}h3{font:600 19px/1.3 var(--serif);margin:26px 0 8px}
.lead{color:var(--mute);max-width:70ch;margin:0 0 22px}
section{display:none}section.on{display:block}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:18px;margin:0 0 18px;overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}th{font-weight:600;color:var(--mute)}
.heat td{border:2px solid var(--panel);text-align:center;font-weight:600;font-variant-numeric:tabular-nums}
.row{display:flex;flex-wrap:wrap;gap:12px;margin:0 0 14px}
select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink)}
label{font-size:13px;color:var(--mute);display:flex;flex-direction:column;gap:4px}
ul.sum{margin:0;padding-left:18px}ul.sum li{margin:6px 0;max-width:80ch}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:600;margin-right:8px;color:#fff}
.strong{background:#1f7a5a}.moderate{background:#1f5fa8}.limited{background:#b7791f}.none{background:#c0392b}.attack-weak{background:#6c7a89}
.f{border-top:1px solid var(--line);padding:11px 0}.f:first-child{border-top:0}
details{margin:8px 0}summary{cursor:pointer;font-weight:600}
.ex{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.ex figure{margin:0}.ex img{width:100%;border-radius:6px;display:block}.ex figcaption{font-size:13px;color:var(--mute);margin-top:6px}
.ex b{color:var(--ink)}
.figs{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:16px}.figs img{width:100%;background:#fff;border-radius:6px;border:1px solid var(--line)}
.leg span{display:inline-flex;align-items:center;gap:6px;margin-right:16px;font-size:13px}.leg i{width:12px;height:12px;border-radius:3px;display:inline-block}
svg text{fill:var(--mute);font:12px var(--sans)}
a:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--def);outline-offset:2px}
@media (max-width:820px){.app{grid-template-columns:1fr}nav{position:static;height:auto;border:0;border-bottom:1px solid var(--line);padding:16px}
nav a{display:inline-block}.ex{grid-template-columns:1fr}.figs{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<nav><h1>DiffCAP results</h1><p id="meta">Loading…</p><div id="links"></div></nav>
<main>
<section id="overview"></section><section id="explorer"></section><section id="findings"></section>
<section id="purification"></section><section id="examples"></section><section id="figures"></section>
</main></div>
<script src="../results/results.js"></script>
<script>
"use strict";
const R = window.RESULTS, $ = s => document.querySelector(s);
const TABS = [["overview","Overview"],["explorer","Metric explorer"],["findings","Findings"],["purification","Purification"],["examples","Examples"],["figures","All graphs"]];
const TASKS = {caption:"Captioning", classification:"Classification"};
const METRICS = {caption:["CLIP-S","Consistency","CIDEr","BLEU4","WinRate","TargetSim"], classification:["Top1","Top5","Consistency"]};
const H = (t, a, ...k) => { const e = document.createElement(t); for (const [x, v] of Object.entries(a || {})) x === "text" ? e.textContent = v : e.setAttribute(x, v); k.flat().forEach(c => e.append(c)); return e; };
const fmt = (v, d = 1) => v == null ? "–" : Number(v).toFixed(d);
const AL = a => (R.meta.attack_labels || {})[a] || a;

if (!R) { document.querySelector("main").innerHTML = "<h2>No results yet</h2><p class='lead'>Run <code>python main.py</code> (on Kaggle), copy the <code>results</code> folder into this project, then reload.</p>"; }
else init();

function init() {
  const m = R.meta;
  $("#meta").textContent = `${m.n_images} images · ${m.vlms.length} models · ${m.attacks.length} attacks · τ=${fmt(m.tau, 3)} · ${m.generated}`;
  $("#links").append(...TABS.map(([id, t]) => H("a", {href: "#" + id, text: t, "data-t": id})));
  overview(); explorer(); findings(); purification(); examples(); figures();
  const go = () => { const id = TABS.some(t => t[0] === location.hash.slice(1)) ? location.hash.slice(1) : "overview";
    document.querySelectorAll("section").forEach(s => s.classList.toggle("on", s.id === id));
    document.querySelectorAll("nav a").forEach(a => a.classList.toggle("on", a.dataset.t === id)); };
  addEventListener("hashchange", go); go();
}

function heat(task) {
  const rows = R.effect.filter(r => r.task === task), t = H("table", {class: "heat"});
  t.append(H("tr", {}, H("th", {text: "Model"}), R.meta.attacks.map(a => H("th", {text: AL(a), style: "text-align:center"}))));
  R.meta.vlms.forEach(v => t.append(H("tr", {}, H("td", {text: v, style: "text-align:left;font-weight:500"}), R.meta.attacks.map(a => {
    const r = rows.find(x => x.vlm === v && x.attack === a), rec = r.recovery;
    const al = rec == null ? 0 : Math.min(Math.max(rec, 0), 1) * .85 + .08, neg = rec != null && rec < 0;
    const td = H("td", {text: rec == null ? "n/a" : Math.round(rec * 100) + "%", title: r.text,
      style: rec == null ? "color:var(--mute)" : `background:${neg ? "rgba(209,73,91," + Math.min(-rec, 1) * .6 + ")" : "rgba(31,95,168," + al + ")"};color:${al > .5 && !neg ? "#fff" : "var(--ink)"}`});
    return td; }))));
  return t;
}

function overview() {
  const s = $("#overview");
  s.append(H("h2", {text: "How much of the attack damage does DiffCAP win back?"}),
    H("p", {class: "lead", text: "Each cell is the share of the loss caused by an attack that DiffCAP recovers, for one model and one attack. 100% means the clean-image result is fully restored; “n/a” means the attack barely hurt that model. Hover a cell for the full sentence."}));
  for (const t of Object.keys(TASKS)) s.append(H("div", {class: "panel"}, H("h3", {text: TASKS[t] + (t === "caption" ? " · CLIP-S" : " · Top-1 accuracy"), style: "margin-top:0"}), heat(t)));
  s.append(H("h3", {text: "Summary"}), H("div", {class: "panel"}, ...Object.keys(TASKS).map(t => H("div", {}, H("b", {text: TASKS[t]}),
    H("ul", {class: "sum"}, R.summaries.per_task[t].map(x => H("li", {text: x})))))));
  s.append(H("p", {class: "lead", text: "Classification reference labels: " + (R.meta.classification_reference || "n/a") + "."}));
}

function bars(labels, series, max) {
  const W = 760, Hh = 300, l = 44, b = 62, t = 14, w = W - l - 10, h = Hh - b - t, g = w / labels.length, bw = g * .36;
  const top = max || Math.max(1e-9, ...series.flatMap(s => s.values.filter(v => v != null))) * 1.12;
  let o = `<svg viewBox="0 0 ${W} ${Hh}" width="100%" role="img">`;
  for (let i = 0; i <= 4; i++) { const y = t + h - h * i / 4; o += `<line x1="${l}" x2="${W - 10}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${l - 6}" y="${y + 4}" text-anchor="end">${fmt(top * i / 4, top < 5 ? 2 : 0)}</text>`; }
  labels.forEach((lb, i) => { const cx = l + g * (i + .5);
    series.forEach((s, k) => { const v = s.values[i]; if (v == null) return; const bh = h * v / top, x = cx + (k - .5 * series.length + .5) * bw - bw / 2 + (k ? 2 : -2);
      o += `<rect x="${x}" y="${t + h - bh}" width="${bw}" height="${bh}" rx="2" fill="${s.color}"/><text x="${x + bw / 2}" y="${t + h - bh - 4}" text-anchor="middle">${fmt(v, top < 5 ? 2 : 1)}</text>`; });
    o += `<text x="${cx}" y="${Hh - 36}" text-anchor="middle">${lb}</text>`; });
  return o + "</svg>";
}

function explorer() {
  const s = $("#explorer"), sel = (id, lbl, opts) => H("label", {text: lbl}, H("select", {id}, opts.map(o => H("option", {value: o[0], text: o[1]}))));
  s.append(H("h2", {text: "Metric explorer"}), H("p", {class: "lead", text: "Pick a task, model and metric. Red bars are the attacked images with no defense; blue bars are the same images after DiffCAP. The Clean group shows what purification costs on untouched images."}),
    H("div", {class: "row"}, sel("xt", "Task", Object.entries(TASKS)), sel("xv", "Model", R.meta.vlms.map(v => [v, v])), sel("xm", "Metric", [])),
    H("div", {class: "panel"}, H("div", {class: "leg"}, H("span", {}, H("i", {style: "background:var(--und)"}), "No defense"), H("span", {}, H("i", {style: "background:var(--def)"}), "DiffCAP")), H("div", {id: "xc"})),
    H("div", {class: "panel", id: "xtb"}));
  const draw = () => {
    const task = $("#xt").value, vlm = $("#xv").value, rows = (task === "caption" ? R.caption_metrics : R.cls_metrics).filter(r => r.vlm === vlm);
    const ms = METRICS[task].filter(k => rows.some(r => r[k] != null));
    if (!ms.includes($("#xm").value)) $("#xm").replaceChildren(...ms.map(k => H("option", {value: k, text: k})));
    const met = $("#xm").value, names = ["clean", ...R.meta.attacks], by = c => (rows.find(r => r.condition === c) || {})[met];
    $("#xc").innerHTML = bars(names.map(AL), [{color: "var(--und)", values: names.map(n => by(n))}, {color: "var(--def)", values: names.map(n => by(n + "+DiffCAP"))}],
      ["Top1", "Top5", "Consistency", "WinRate"].includes(met) && task === "classification" || met === "WinRate" ? 100 : null);
    const t = H("table", {}, H("tr", {}, H("th", {text: "Condition"}), ms.map(k => H("th", {text: k}))));
    rows.forEach(r => t.append(H("tr", {}, H("td", {text: r.condition}), ms.map(k => H("td", {text: fmt(r[k], 2)})))));
    $("#xtb").replaceChildren(t);
  };
  ["#xt", "#xv", "#xm"].forEach(i => $(i).addEventListener("change", draw)); draw();
}

function findings() {
  const s = $("#findings"), opt = (id, lbl, o) => H("label", {text: lbl}, H("select", {id}, [["all", "All"], ...o].map(x => H("option", {value: x[0], text: x[1]}))));
  s.append(H("h2", {text: "Findings"}), H("p", {class: "lead", text: "One sentence for every model, task and attack, generated from the measured numbers. Recovery is only judged when the attack caused a measurable drop."}),
    H("h3", {text: "By model"}), H("div", {class: "panel"}, R.meta.vlms.map(v => H("details", {}, H("summary", {text: v}), H("ul", {class: "sum"}, R.summaries.per_vlm[v].map(x => H("li", {text: x})))))),
    H("h3", {text: "By attack"}), H("div", {class: "panel"}, R.meta.attacks.map(a => H("details", {}, H("summary", {text: AL(a)}), H("ul", {class: "sum"}, R.summaries.per_attack[a].map(x => H("li", {text: x})))))),
    H("h3", {text: "Every combination"}),
    H("div", {class: "row"}, opt("ft", "Task", Object.entries(TASKS)), opt("fv", "Model", R.meta.vlms.map(v => [v, v])), opt("fa", "Attack", R.meta.attacks.map(a => [a, AL(a)])),
      opt("fq", "Verdict", [["strong", "Strong"], ["moderate", "Moderate"], ["limited", "Limited"], ["none", "None"], ["attack-weak", "Attack weak"]])),
    H("div", {class: "panel", id: "fl"}));
  const draw = () => { const f = {task: $("#ft").value, vlm: $("#fv").value, attack: $("#fa").value, verdict: $("#fq").value};
    const rows = R.effect.filter(r => Object.entries(f).every(([k, v]) => v === "all" || r[k] === v));
    $("#fl").replaceChildren(...(rows.length ? rows.map(r => H("div", {class: "f"}, H("span", {class: "pill " + r.verdict, text: r.verdict === "attack-weak" ? "attack weak" : r.verdict}), r.text)) : [H("p", {text: "No combination matches these filters."})])); };
  ["#ft", "#fv", "#fa", "#fq"].forEach(i => $(i).addEventListener("change", draw)); draw();
}

function purification() {
  const s = $("#purification"), cols = [["set", "Set"], ["mean_t", "Mean depth t"], ["psnr_clean_vs_adv", "PSNR attacked (dB)"], ["psnr_clean_vs_pur", "PSNR purified (dB)"], ["cos_clean_vs_adv", "CLIP cos attacked"], ["cos_clean_vs_pur", "CLIP cos purified"]];
  const t = H("table", {}, H("tr", {}, cols.map(c => H("th", {text: c[1]}))));
  R.purification.forEach(r => t.append(H("tr", {}, cols.map(c => H("td", {text: c[0] === "set" ? AL(r.set) : fmt(r[c[0]], c[0] === "mean_t" || c[0].startsWith("cos") ? 3 : 2)})))));
  s.append(H("h2", {text: "Purification"}), H("p", {class: "lead", text: "DiffCAP chooses how much noise to add per image. A higher depth removes more of the perturbation but risks washing out detail; fidelity columns compare each image with its clean original."}),
    H("div", {class: "panel"}, t), H("div", {class: "panel"}, H("img", {src: "../results/figures/purification_quality.png", alt: "Purification depth and fidelity", style: "width:100%"})));
}

function examples() {
  const s = $("#examples"); s.append(H("h2", {text: "Examples"}), H("p", {class: "lead", text: "Clean, attacked and purified versions of the same image, with each model’s caption and class prediction. “Largest recovery” cases are selected, not representative."}),
    H("div", {class: "row"}, H("label", {text: "Attack"}, H("select", {id: "ea"}, R.meta.attacks.map(a => H("option", {value: a, text: AL(a)})))), H("label", {text: "Model"}, H("select", {id: "ev"}, R.meta.vlms.map(v => H("option", {value: v, text: v}))))), H("div", {id: "el"}));
  const draw = () => { const a = $("#ea").value, v = $("#ev").value, T = [["clean", "Clean"], ["adv", "Attacked"], ["pur", "Attacked + DiffCAP"]];
    $("#el").replaceChildren(...R.examples.filter(e => e.attack === a).map(e => { const d = e.vlms[v];
      return H("div", {class: "panel"}, H("p", {}, H("b", {text: `Image ${e.image}`}), ` · ${e.kind} · true class: ${d.truth}`),
        H("div", {class: "ex"}, T.map(([k, n]) => H("figure", {}, H("img", {src: "../results/" + e.paths[k], alt: n}), H("figcaption", {}, H("b", {text: n}), H("br"), d.caption[k], H("br"), "class: " + d.class[k]))))); })); };
  ["#ea", "#ev"].forEach(i => $(i).addEventListener("change", draw)); draw();
}

function figures() {
  $("#figures").append(H("h2", {text: "All graphs"}), H("p", {class: "lead", text: "The same figures the pipeline saved in results/figures."}),
    H("div", {class: "figs"}, R.figures.map(f => H("figure", {style: "margin:0"}, H("img", {src: "../results/" + f.file, alt: f.title}), H("figcaption", {text: f.title, class: "lead", style: "margin:6px 0 0"})))));
}
</script>
</body>
</html>
